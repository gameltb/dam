version: v2
inputs:
  - directory: schema
    paths:
      - schema/flowcraft/v1/actions/prompt_gen.proto
      - schema/flowcraft/v1/actions/image_enhance.proto
      - schema/flowcraft/v1/actions/node_transform.proto
      - schema/flowcraft/v1/actions/chat_actions.proto
plugins:
  - local: ["/root/go/bin/protoc-gen-jsonschema"]
    out: src/generated/schemas
    include_imports: false
    opt:
      - target=proto
